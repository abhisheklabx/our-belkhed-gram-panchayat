services:
  - type: web
    name: our-belkhed
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "wsgi:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_NAME
        value: Abhishek Thakare
      - key: ADMIN_EMAIL
        value: abhishek@belkhed.gov.in
      - key: ADMIN_PASSWORD
        value: Pass@123
